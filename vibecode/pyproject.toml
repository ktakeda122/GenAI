[project]
name = "baseball-sim"
version = "0.1.0"
description = "Deterministic state-machine simulator for one half-inning of baseball."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["baseball*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
